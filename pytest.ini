# pytest for the CI tooling (scripts/ci/tests). Coverage scope is .coveragerc; the XML report feeds
# Sonar and the per-file gate. Warnings are errors; skips and xfails are banned (suppression scan).
[pytest]
testpaths = scripts/ci/tests
pythonpath = scripts/ci
addopts =
    -p no:cacheprovider
    --strict-markers
    --strict-config
    -ra
    --cov
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=xml:reports/coverage/scripts.xml
    --junitxml=reports/junit/pytest.xml
    # pytest-xdist: at most four worker processes (fewer on a smaller machine). Measured on the laptop
    # (docs/research/pipeline-baseline.md, the tests addendum): 12.4 s on one process, 5.9 s on four, 7.8 s on
    # one per core, whose start-up costs more than it saves. pytest-cov combines the workers' coverage.
    --numprocesses=auto
    --maxprocesses=4
xfail_strict = true
filterwarnings =
    error
    # editorconfig 0.17.1 (the latest release, used by scripts/ci/check_editorconfig.py) opens
    # .editorconfig with codecs.open(), deprecated since Python 3.14. Only that library's warning is
    # tolerated; drop this line when a release reads files with open().
    ignore:codecs.open\(\) is deprecated:DeprecationWarning:editorconfig
