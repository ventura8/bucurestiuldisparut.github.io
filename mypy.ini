# mypy --strict for the CI tooling (scripts/ci and its tests). The raster pipeline (M3) adds its
# own section or config together with the GDAL stubs in typings/.
[mypy]
python_version = 3.14
strict = True
warn_unreachable = True
files = scripts/ci
mypy_path = scripts/ci
cache_dir = reports/.cache/mypy
