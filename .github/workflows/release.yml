name: Release

# Publishes a v* tag (.agent/skills/quality/prepare_release_skill.md, docs/research/M5-interfaces.md §2.5). The
# `build` job runs the pipeline's `release` stage in the quality image with read-only access: the tag is
# vMAJOR.MINOR.PATCH and matches every package.json, every workspace dependency, ENGINE_VERSION, the released
# engine's cdn/engine/release.json and the starter kit's pinned folder, and both docs/releases notes files exist with
# the description's pinned addresses equal to release.json's (scripts/ci/check_release.py); release.json lists every
# committed engine file with its SHA-384 integrity and the kit pins exactly those (kit-pins); the engine and admin
# bundles are rebuilt, and cdn/engine/ must equal the fresh engine build byte for byte (release-cdn), which jsDelivr
# then serves from the tag at https://cdn.jsdelivr.net/gh/<repo>@vX.Y.Z/cdn/engine/; create-historic-city is packed.
# The job summary shows the pinned addresses and their integrity. Only then the `publish` job, the one holding
# `contents: write`, creates the GitHub Release from the uploaded files without running any repository code: titled
# by the H1 of the description file, with that file as its body and the bundles attached. The pre-push hook already
# required PIPELINE_STAGE=all green on the tagged commit. Proposed, not applied (DECISIONS-for-review.md §58c): the
# SonarQube gate of the same commit, release.json and the CLI's package on the GitHub Release, the purge of jsDelivr's
# @1 alias.

on:
    push:
        tags: ['v*']

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Release checks & bundles
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/quality-image

            - name: Release stage
              env:
                  PIPELINE_STAGE: release
                  HCM_DOCKER_BUILD_FLAGS: --load --cache-from type=gha,scope=hcm-quality
              run: bash scripts/ci/run-all-checks.sh

            # The pinned jsDelivr addresses and the SHA-384 integrity of this release, as the release-cdn gate wrote them
            # from cdn/engine/release.json (the same block as the description file's), on the run's summary page.
            - name: Engine addresses and integrity
              run: cat reports/release/engine-addresses.md >>"$GITHUB_STEP_SUMMARY"

            - name: Upload the release files
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: release
                  path: |
                      packages/engine/dist/
                      packages/admin/dist/
                      docs/releases/
                  if-no-files-found: error
                  retention-days: 7

    publish:
        name: Publish GitHub Release
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            # upload-artifact keeps the paths below their common ancestor, the repository root: hence release/.
            - name: Download the release files
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: release
                  path: release

            # The single H1 of the description file is the release title (docs/releases/README.md).
            - name: Release title
              id: notes
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  title="$(sed -n 's/^# //p' "release/docs/releases/${TAG}_github_description.md" | head -n 1)"
                  echo "title=${title:-$TAG}" >>"$GITHUB_OUTPUT"

            - name: GitHub Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  name: ${{ steps.notes.outputs.title }}
                  body_path: release/docs/releases/${{ github.ref_name }}_github_description.md
                  fail_on_unmatched_files: true
                  files: |
                      release/packages/engine/dist/*
                      release/packages/admin/dist/*
