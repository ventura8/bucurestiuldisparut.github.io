name: Nightly E2E

# The whole e2e matrix once a night on master (docs/research/DECISIONS-for-review.md §28): every tier of
# e2e/projects.ts, the `tour-matrix` tier included, that is the full layout tour over 11 viewports x light and dark x
# Romanian and English. Every push runs the per-push `tour` tier instead (.github/workflows/ci.yml), which carries
# every tour scenario row; before a push to master or a tag the local `all` stage runs the full matrix too. This
# workflow runs the same pipeline stages as `all` does, `e2e` and `tour-matrix`, split by tier and by measured test
# time, and keeps the image's layer cache warm. A failure opens or updates one issue, "Nightly e2e failed", like the
# weekly deps and contract runs.

on:
    schedule:
        # Every day 02:37 UTC (05:37 in Bucharest), after the day's pushes.
        - cron: '37 2 * * *'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read

env:
    HCM_IMAGE: hcm-quality:local
    LOAD_IMAGE: --load --cache-from type=gha,scope=hcm-quality

jobs:
    build-image:
        name: Build & Cache Quality Image
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/quality-image

            - name: Build the quality image into the Actions cache
              env:
                  HCM_DOCKER_BUILD_FLAGS: >-
                      --cache-from type=gha,scope=hcm-quality --cache-to type=gha,mode=max,scope=hcm-quality --output type=cacheonly
              run: bash scripts/ci/build-and-test.sh

    e2e:
        name: Nightly E2E (Playwright) ${{ matrix.part }}
        needs: build-image
        runs-on: ubuntu-24.04
        # The heaviest part is about 1,180 s of test time on the laptop: about 12 to 16 minutes on a 4-vCPU runner with
        # Playwright's 2 workers, plus about 3 for the image and the servers.
        timeout-minutes: 45
        permissions:
            contents: read
            checks: write
        strategy:
            fail-fast: false
            matrix:
                # The four `e2e` jobs of ci.yml (`tier` is E2E_TIER, `shard` E2E_SHARD within that tier), plus the
                # `tour-matrix` stage (35 projects of 7 tests, about 2,360 s of laptop test time, the largest frames
                # first) in two parts of about 1,180 s: its first two fifths and its last three ("first-last/total",
                # e2e/playwright.config.ts). The union must stay every tier.
                include:
                    - part: functional 1/3
                      stage: e2e
                      tier: fn
                      shard: 1/3
                    - part: functional 2/3
                      stage: e2e
                      tier: fn
                      shard: 2/3
                    - part: functional 3/3
                      stage: e2e
                      tier: fn
                      shard: 3/3
                    - part: admin, smoke, a11y, no-WebGL, tour
                      stage: e2e
                      tier: admin,smoke,a11y,nogl,tour
                      shard: ''
                    - part: tour matrix, largest frames
                      stage: tour-matrix
                      tier: tour-matrix
                      shard: 1-2/5
                    - part: tour matrix, the rest
                      stage: tour-matrix
                      tier: tour-matrix
                      shard: 3-5/5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/quality-image

            # The log is kept for the failure issue; the runner's bash has pipefail, so the stage's status decides.
            - name: E2E stage
              env:
                  PIPELINE_STAGE: ${{ matrix.stage }}
                  E2E_TIER: ${{ matrix.tier }}
                  E2E_SHARD: ${{ matrix.shard }}
                  HCM_DOCKER_BUILD_FLAGS: ${{ env.LOAD_IMAGE }}
                  LOG_FILE: reports/nightly/e2e-${{ strategy.job-index }}.log
              run: |
                  mkdir -p "$(dirname "$LOG_FILE")"
                  bash scripts/ci/run-all-checks.sh 2>&1 | tee "$LOG_FILE"

            - name: E2E test report
              if: ${{ !cancelled() }}
              uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
              with:
                  check_name: Nightly E2E Test Report (${{ matrix.part }})
                  report_paths: reports/junit/e2e*.xml
                  require_tests: true
                  detailed_summary: true

            # A `tour-matrix` part writes reports/playwright-tour-matrix/ and reports/test-results-tour-matrix/
            # (e2e/playwright.config.ts), an `e2e` part reports/playwright/ and reports/test-results/.
            - name: Upload the Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nightly-e2e-${{ strategy.job-index }}
                  path: |
                      reports/playwright*/
                      reports/test-results*/
                  if-no-files-found: ignore
                  retention-days: 7

            - name: Upload the log
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: nightly-log-${{ strategy.job-index }}
                  path: reports/nightly/
                  if-no-files-found: ignore
                  retention-days: 7

    report:
        name: Open or update the failure issue
        needs: [build-image, e2e]
        # Any failed job above, the image build included (a cancelled run reports nothing).
        if: ${{ failure() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: write
        steps:
            # Only for the local action below; no build, test or install code runs in this job.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # One log per e2e job (e2e-<index>.log), merged into one folder.
            - name: Download the logs
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: nightly-log-*
                  merge-multiple: true
                  path: logs

            - name: Collect the verdicts
              run: |
                  find logs -name 'e2e-*.log' -print0 | sort -z | xargs -0 -r cat >nightly.log
                  if [[ ! -s nightly.log ]]; then
                      echo "[FAILURE] no e2e log: the quality image build failed before any e2e job ran" >nightly.log
                  fi

            - name: Open or update the failure issue
              uses: ./.github/actions/upsert-issue
              with:
                  title: Nightly e2e failed
                  log: nightly.log
                  token: ${{ github.token }}
                  advice: >-
                      The full e2e matrix failed on master. Open the run, download the `nightly-e2e-*` artifact of the
                      failed part (the Playwright report and the traces), reproduce it locally with
                      `PIPELINE_STAGE=<stage> E2E_TIER=<tier> E2E_SHARD=<shard> bash scripts/ci/run-all-checks.sh`, and record the
                      cause in docs/LESSONS.md if a test found a bug.
