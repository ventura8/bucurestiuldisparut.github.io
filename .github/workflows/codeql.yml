name: CodeQL

# Code scanning, advanced setup (GitHub's default setup must stay off: the two cannot coexist).
# security-extended queries over the TypeScript/JavaScript, the Python tooling and the workflows
# themselves; nothing is built (build-mode none). Third-party and legacy trees are not ours to scan.

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Tuesdays 04:27 UTC: new queries reach unchanged code too.
        - cron: '27 4 * * 2'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                language: [actions, javascript-typescript, python]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Initialize CodeQL
              uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  languages: ${{ matrix.language }}
                  build-mode: none
                  queries: security-extended
                  config: |
                      paths-ignore:
                          - seed
                          - vendor
                          - '**/dist'
                          - docs/research

            - name: Analyze
              uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
              with:
                  category: /language:${{ matrix.language }}
