name: Feature request
description: A new capability for the map, the admin or another city.
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: Who needs this and what they cannot do today.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: What should happen, as the user would see it.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
