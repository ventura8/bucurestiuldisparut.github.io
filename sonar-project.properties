# SonarQube Cloud analysis scope: the single source of truth for what is analysed and measured.
# Scanned by scripts/ci/sonar_scan.sh (local `sonar` stage, pinned scanner image) and by the Sonar job
# of the CI workflow. scripts/ci/check_coverage.py reads sources, inclusions, exclusions,
# coverage.exclusions and both coverage report keys from this file, so its per-file gate always
# measures exactly what Sonar measures. scripts/ci/sonar_report.py reads the organisation, key and host.
# No token here: SONAR_TOKEN or the git-ignored .sonar-token. Inline Sonar markers, sonar.issue.ignore.*
# and "Accepted" / "False positive" resolutions are forbidden: fix the code.
# SonarCloud Automatic Analysis must be OFF (CI-based analysis only).
sonar.organization=ventura8
sonar.projectKey=ventura8_bucurestiuldisparut.github.io
sonar.projectName=Historic City Map - Bucuresti disparut
sonar.host.url=https://sonarcloud.io
# No sonar.projectVersion: the scan passes the root package.json version (no drift).
sonar.sourceEncoding=UTF-8

# Product code. Every folder listed must exist (the scanner refuses to start otherwise, and so does
# check_coverage.py), so a new one joins with the milestone that creates it (sites/ and starter-kit/
# in M1 and M5). docker/, scripts/git-hooks, .github/workflows and .github/actions are analysed for Sonar's
# Dockerfile, shell and GitHub Actions rules (no coverage applies to them). scripts/site/src is the static site
# build: product code (the page, its CSP, the served manifest), measured by Vitest's `tools` project.
sonar.sources=packages/shared/src,\
    packages/ui/src,\
    packages/engine/src,\
    packages/admin/src,\
    functions/src,\
    pipeline/src,\
    scripts/ci,\
    scripts/site/src,\
    scripts/git-hooks,\
    docker,\
    .github/workflows,\
    .github/actions
# Tests and test-only code (the test kit is never shipped). scripts/ci/tests lies inside a source
# folder, so it is also excluded from the sources below (a file cannot be indexed twice).
sonar.tests=packages/shared/test,\
    packages/ui/test,\
    packages/engine/test,\
    packages/admin/test,\
    packages/test-support/src,\
    functions/test,\
    firebase/rules-tests/test,\
    pipeline/tests,\
    scripts/ci/tests,\
    scripts/site/test,\
    scripts/seed/test,\
    packages/ui/scripts/test,\
    e2e
sonar.exclusions=**/node_modules/**,\
    **/dist/**,\
    **/.tsbuild/**,\
    **/*.d.ts,\
    **/__pycache__/**,\
    **/typings/**,\
    reports/**,\
    seed/**,\
    vendor/**,\
    docs/research/**,\
    scripts/ci/tests/**
# Intentionally EMPTY: every measured file reaches 90 % (no coverage exclusions, AGENTS.md).
sonar.coverage.exclusions=
# The ro/en catalogues are parallel by design (same keys, translated values).
sonar.cpd.exclusions=packages/shared/src/i18n/**

# TypeScript: the per-package projects (src and test) of the root solution tsconfig.json.
sonar.typescript.tsconfigPaths=tsconfig.json,\
    packages/*/tsconfig.json,\
    packages/*/test/tsconfig.json,\
    functions/tsconfig.json,\
    functions/test/tsconfig.json,\
    firebase/rules-tests/tsconfig.json,\
    scripts/site/tsconfig.json,\
    scripts/site/test/tsconfig.json,\
    scripts/seed/test/tsconfig.json,\
    packages/ui/scripts/test/tsconfig.json,\
    e2e/tsconfig.json
# Vitest (v8 provider) writes one merged LCOV with repository-relative paths.
sonar.javascript.lcov.reportPaths=reports/coverage/ts/lcov.info

# Python 3.14 (the GDAL image's interpreter); pytest-cov writes Cobertura XML with paths relative to
# its <source>: scripts.xml for scripts/ci (pytest.ini), pipeline.xml for the raster pipeline
# (pipeline/pyproject.toml). Both must exist when check_coverage.py runs, at the end of the tests stage.
sonar.python.version=3.14
sonar.python.coverage.reportPaths=reports/coverage/scripts.xml,reports/coverage/pipeline.xml
sonar.python.xunit.reportPath=reports/junit/pytest.xml,reports/junit/pipeline.xml
